# Optional: uncomment to fail the build on warnings locally.
# [build]
# rustflags = ["-D", "warnings"]

# Local dev: build against a sibling sysml-v2-parser checkout instead of the revision pinned in
# the root Cargo.toml. See DEVELOPMENT.md "Authority Pipeline Policy".
#
# The patch key must be the git URL, not `crates-io`. The workspace no longer depends on the
# published crate at all, so a `[patch.crates-io]` entry would resolve nothing and silently leave
# you building the pinned revision.
#
# `cargo deny check bans` and the guard test in `crates/source_identity` both read the resolved
# graph, so an active patch shows up as a parser resolved from a path rather than from git. That is
# intended -- comment this out before producing evidence for a pin bump.
# [patch."https://github.com/lukewilliamboswell/sysml-v2-parser.git"]
# sysml-v2-parser = { path = "../sysml-v2-parser" }

# `cargo snapshot check` / `cargo snapshot update`: the snapshot tool builds every fixture's
# publication, so it runs in release; the debug profile is 10-30x slower on this workload.
[alias]
snapshot = "run --release -p spec42-snapshot --"
