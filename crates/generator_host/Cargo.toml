[package]
name = "generator_host"
version.workspace = true
edition.workspace = true
description = "Sandboxed WebAssembly Component host for Spec42 generators"

[dependencies]
generator_api = { path = "../generator_api" }
wasmtime = { version = "47", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
