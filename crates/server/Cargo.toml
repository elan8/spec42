[package]
name = "server"
version.workspace = true
edition = "2021"
description = "Language server for SysML v2 (LSP over stdio)"

[[bin]]
name = "spec42"
path = "src/main.rs"

[lib]
name = "spec42"
path = "src/lib.rs"

[features]
default = ["embed-stdlib", "embed-kpar-libraries"]
embed-stdlib = ["workspace/embed-stdlib"]
embed-kpar-libraries = ["workspace/embed-kpar-libraries"]

[dependencies]
workspace = { path = "../workspace", default-features = false }
lsp_server = { path = "../lsp_server" }
sysml_model = { path = "../sysml_model" }
sysml_query = { path = "../sysml_query" }
generator_api = { path = "../generator_api" }
generator_host = { path = "../generator_host" }
walkdir = "2"
kpar = { path = "../kpar" }
tokio = { version = "1", features = ["full"] }
serde_json = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
directories = "5"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
tower-lsp = "0.20"
rquickjs = "0.11"
sha2 = { workspace = true }
tempfile = "3"

[dev-dependencies]
wat = "1"
lsp_server = { path = "../lsp_server" }
sysml-v2-parser = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
tower-lsp = "0.20"
url = "2"
anyhow = "1"
