[package]
name = "server"
version.workspace = true
edition = "2021"
description = "Language server for SysML v2 (LSP over stdio)"

[[bin]]
name = "spec42"
path = "src/main.rs"

[lib]
name = "spec42"
path = "src/lib.rs"

[features]
default = ["embed-stdlib", "embed-kpar-libraries"]
embed-stdlib = ["library_catalog/embed-stdlib"]
embed-kpar-libraries = ["library_catalog/embed-kpar-libraries"]

[dependencies]
# The batch host: validation, reports, engine and snapshots.
workspace = { path = "../workspace" }
library_catalog = { path = "../library_catalog", default-features = false }
# Launch-only: `run_lsp`, `default_server_config`, `init_tracing`, and the custom-RPC traits.
# Nothing semantic and no validation crosses this edge — see `crates/sysml_query/tests/architecture.rs`.
lsp_server = { path = "../lsp_server" }
sysml_diagnostics = { path = "../sysml_diagnostics" }
sysml_query = { path = "../sysml_query" }
generator_api = { path = "../generator_api" }
generator_host = { path = "../generator_host" }
walkdir = "2"
kpar = { path = "../kpar" }
tokio = { version = "1", features = ["full"] }
serde_json = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
directories = "5"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
tower-lsp = "0.20"
rquickjs = "0.11"
sha2 = { workspace = true }
tempfile = "3"

[dev-dependencies]
wat = "1"
# Launch-only: `run_lsp`, `default_server_config`, `init_tracing`, and the custom-RPC traits.
# Nothing semantic and no validation crosses this edge — see `crates/sysml_query/tests/architecture.rs`.
lsp_server = { path = "../lsp_server" }
serde_json = { workspace = true }
tempfile = "3"
tower-lsp = "0.20"
url = "2"
anyhow = "1"
