[package]
name = "lsp_server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core library for Spec42 LSP server: semantic model, DTOs, extension traits"

[lib]
name = "lsp_server"

[features]
default = []

[dependencies]
workspace = { path = "../workspace", default-features = false }
workspace_session = { path = "../workspace_session" }
language_service = { path = "../language_service" }
generator_api = { path = "../generator_api" }
generator_host = { path = "../generator_host" }
spec42-generator-protocol = { path = "../generator_protocol" }
base64 = "0.22"
sysml_diagnostics = { path = "../sysml_diagnostics" }
sysml_query = { path = "../sysml_query" }
sysml_tokens = { path = "../sysml_tokens" }
sysml_resolution = { path = "../sysml_resolution" }
petgraph = { workspace = true }
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
tempfile = "3.27.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
toml = "0.8"
glob = "0.3"
rayon = "1.12"

[dev-dependencies]
# Used by LSP integration tests when constructing `file://` URIs.
url = "2"
server = { path = "../server", default-features = false }
wat = "1"
