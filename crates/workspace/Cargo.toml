[package]
name = "workspace"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Batch host: engine, directory snapshots, validation, comparison and schema versions over the typed facade"

[dependencies]
library_catalog = { path = "../library_catalog" }
sysml_diagnostics = { path = "../sysml_diagnostics" }
sysml_query = { path = "../sysml_query" }
language_service = { path = "../language_service" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = "2"
tempfile = "3"

[dev-dependencies]
kpar = { path = "../kpar" }
library_catalog = { path = "../library_catalog" }
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

[[test]]
name = "dependency_guardrails"
path = "tests/dependency_guardrails.rs"

[[test]]
name = "library_source_resolution"
path = "tests/library_source_resolution.rs"

[[test]]
name = "artifact_metadata_serde"
path = "tests/artifact_metadata_serde.rs"

[[test]]
name = "host_errors"
path = "tests/host_errors.rs"

[[test]]
name = "cancellation"
path = "tests/cancellation.rs"

[[test]]
name = "resource_limits"
path = "tests/resource_limits.rs"

[[test]]
name = "comparison_diagnostics"
path = "tests/comparison_diagnostics.rs"

[[test]]
name = "comparison_identity"
path = "tests/comparison_identity.rs"

[[test]]
name = "document_changes"
path = "tests/document_changes.rs"

[[test]]
name = "deferred_validation"
path = "tests/deferred_validation.rs"

[[test]]
name = "skip_guardrails"
path = "tests/skip_guardrails.rs"
