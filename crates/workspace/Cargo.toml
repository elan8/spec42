[package]
name = "workspace"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Batch host: engine, directory snapshots, validation, comparison and schema versions over the typed facade"

[dependencies]
library_catalog = { path = "../library_catalog", default-features = false }
sysml_diagnostics = { path = "../sysml_diagnostics" }
sysml_query = { path = "../sysml_query" }
language_service = { path = "../language_service" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = "2"
tempfile = "3"

[dev-dependencies]
kpar = { path = "../kpar" }
library_catalog = { path = "../library_catalog" }
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
