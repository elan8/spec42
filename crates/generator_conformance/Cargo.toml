[package]
name = "generator_conformance"
version.workspace = true
edition.workspace = true
description = "Conformance and benchmark harness for the Spec42 generator ABI"

[lib]
name = "generator_conformance"
path = "src/lib.rs"

[[bin]]
name = "generator-conformance"
path = "src/main.rs"

[dependencies]
generator_api = { path = "../generator_api" }
generator_host = { path = "../generator_host" }
sysml_query = { path = "../sysml_query" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
rayon = "1"
clap = { workspace = true }

[dev-dependencies]
tempfile = "3"
