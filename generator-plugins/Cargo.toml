[workspace]
resolver = "2"
members = ["diagram", "example"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spec42-generator-sdk = { path = "../crates/generator_sdk" }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
codegen-units = 1
