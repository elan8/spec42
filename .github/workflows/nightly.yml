name: Nightly

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sysml-release-validation:
    name: SysML release validation (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Prepare SysML stdlib bundle
        run: |
          VERSION=$(node -p "require('./config/standard-library.json').version")
          echo "SPEC42_STDLIB_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "SPEC42_STDLIB_KPAR_DIR=${{ github.workspace }}/.cache/sysml-stdlib-kpar-${VERSION}" >> $GITHUB_ENV

      - name: Restore SysML stdlib bundle cache
        uses: actions/cache/restore@v4
        id: stdlib-cache
        with:
          path: .cache/sysml-stdlib-kpar-${{ env.SPEC42_STDLIB_VERSION }}
          key: sysml-stdlib-${{ env.SPEC42_STDLIB_VERSION }}

      - name: Fetch SysML stdlib bundle
        if: steps.stdlib-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch-stdlib-bundle.sh

      - name: Save SysML stdlib bundle cache
        if: steps.stdlib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/sysml-stdlib-kpar-${{ env.SPEC42_STDLIB_VERSION }}
          key: sysml-stdlib-${{ env.SPEC42_STDLIB_VERSION }}

      - name: Prepare KPAR library bundles
        run: |
          DOMAIN_VERSION=$(node -p "require('./config/libraries/domain.json').version")
          METHOD_VERSION=$(node -p "require('./config/libraries/method.json').version")
          echo "SPEC42_DOMAIN_LIBRARIES_VERSION=${DOMAIN_VERSION}" >> $GITHUB_ENV
          echo "SPEC42_METHOD_LIBRARIES_VERSION=${METHOD_VERSION}" >> $GITHUB_ENV
          echo "SPEC42_KPAR_LIBRARY_BUNDLE_DOMAIN=${{ github.workspace }}/.cache/elan8-domain-libraries-${DOMAIN_VERSION}.kpar" >> $GITHUB_ENV
          echo "SPEC42_KPAR_LIBRARY_BUNDLE_METHOD=${{ github.workspace }}/.cache/elan8-method-libraries-${METHOD_VERSION}.kpar" >> $GITHUB_ENV

      - name: Restore KPAR library bundles cache
        uses: actions/cache/restore@v4
        id: kpar-libraries-cache
        with:
          path: |
            .cache/elan8-domain-libraries-${{ env.SPEC42_DOMAIN_LIBRARIES_VERSION }}.kpar
            .cache/elan8-method-libraries-${{ env.SPEC42_METHOD_LIBRARIES_VERSION }}.kpar
          key: kpar-libraries-domain-${{ env.SPEC42_DOMAIN_LIBRARIES_VERSION }}-method-${{ env.SPEC42_METHOD_LIBRARIES_VERSION }}

      - name: Fetch KPAR library bundles
        if: steps.kpar-libraries-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch-kpar-libraries-bundle.sh

      - name: Save KPAR library bundles cache
        if: steps.kpar-libraries-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/elan8-domain-libraries-${{ env.SPEC42_DOMAIN_LIBRARIES_VERSION }}.kpar
            .cache/elan8-method-libraries-${{ env.SPEC42_METHOD_LIBRARIES_VERSION }}.kpar
          key: kpar-libraries-domain-${{ env.SPEC42_DOMAIN_LIBRARIES_VERSION }}-method-${{ env.SPEC42_METHOD_LIBRARIES_VERSION }}

      - name: Clone SysML-v2-Release
        run: git clone --depth 1 --branch 2026-04 https://github.com/Systems-Modeling/SysML-v2-Release.git sysml-v2-release

      - name: Check SysML graphical notation inventory
        env:
          SYSML_V2_RELEASE_DIR: ${{ github.workspace }}/sysml-v2-release
        run: node scripts/generate-notation-inventory.mjs --check

      - name: Run workspace scan test with SysML release
        env:
          SYSML_V2_RELEASE_DIR: ${{ github.workspace }}/sysml-v2-release
        run: cargo test -p lsp_server lsp_workspace_scan_sysml_release -- --nocapture

      - name: Engineering unit catalog regression
        env:
          SYSML_V2_RELEASE_DIR: ${{ github.workspace }}/sysml-v2-release
        run: cargo test -p sysml_resolution unit --lib -- --nocapture

      - name: OMG 14c metadata diagnostic ratchet
        env:
          SYSML_V2_RELEASE_DIR: ${{ github.workspace }}/sysml-v2-release
        run: bash scripts/check-omg-14c-metadata-ratchet.sh

  language-and-generator-exploratory:
    name: Language and generator fuzzing (exploratory)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Informational, not a gate. Neither fuzzing nor a mutation score can gate a PR: they are
    # not reproducible from the same inputs twice, and required CI must be. What lasts from a
    # run is a minimal input -- turn findings into deterministic regression
    # inputs and let normal tests gate instead.
    #
    # Steps fail visibly rather than being swallowed by `|| true`: a missing tool or a broken
    # target should be obvious, and `continue-on-error` already keeps the job advisory.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Fuzz artifact path parsing
        run: cargo fuzz run artifact_path -- -max_total_time=300 -print_final_stats=1

      - name: Fuzz ABI payload decoding
        run: cargo fuzz run abi_decode -- -max_total_time=300 -print_final_stats=1


      - name: Fuzz immutable SysML publication
        run: cargo fuzz run sysml_publication fuzz/corpus/sysml -- -max_total_time=300 -print_final_stats=1

      - name: Fuzz SysML formatter convergence
        run: cargo fuzz run sysml_formatter fuzz/corpus/sysml -- -max_total_time=300 -print_final_stats=1

      - name: Mutation-test the transaction planner
        run: |
          cargo mutants --package server --file 'src/generation/plan.rs' \
            --timeout 60 --output target/mutants

      - name: Upload exploratory artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: language-and-generator-exploratory
          if-no-files-found: ignore
          path: |
            fuzz/artifacts/**
            target/mutants/**
