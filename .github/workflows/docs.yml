# Publish the VitePress docs site to GitHub Pages.
# Release triggers this on `main` (required by the github-pages environment branch
# policy) and passes the release tag as `ref` so the site still tracks product pins.
# Manual runs can leave `ref` empty to build the current workflow ref.
name: Deploy Docs

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (release tag, branch, or SHA). Leave empty for the workflow ref.
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Explicit release tag / dispatch input — never workflow_run head_sha.
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
        working-directory: docs-site
      - run: npm run docs:build
        working-directory: docs-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
