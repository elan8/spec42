# CI: required fast checks plus targeted integration smoke tests.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  VSCODE_TEST_VERSION: "1.106.0"
  # Keep in sync with `channel` in rust-toolchain.toml; bump both deliberately.
  RUST_TOOLCHAIN_VERSION: "1.97.1"

jobs:
  rust-core:
    name: Rust core checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: Standard library config is current
        run: node scripts/sync-standard-library-config.mjs --check

      - name: KPAR libraries config is current
        run: node scripts/sync-kpar-libraries-config.mjs --check

      - name: Extension versions match Cargo workspace
        run: node scripts/sync-workspace-version.mjs --check

      - name: SysML reference tooling smoke checks
        run: python3 -m unittest tools/sysml_reference/test_tools.py

      - name: Prepare SysML stdlib bundle
        run: |
          VERSION=$(node -p "require('./config/standard-library.json').version")
          echo "SPEC42_STDLIB_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "SPEC42_STDLIB_KPAR_DIR=${{ github.workspace }}/.cache/sysml-stdlib-kpar-${VERSION}" >> $GITHUB_ENV

      - name: Restore SysML stdlib bundle cache
        uses: actions/cache/restore@v4
        id: stdlib-cache
        with:
          path: .cache/sysml-stdlib-kpar-${{ env.SPEC42_STDLIB_VERSION }}
          key: sysml-stdlib-${{ env.SPEC42_STDLIB_VERSION }}

      - name: Fetch SysML stdlib bundle
        if: steps.stdlib-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch-stdlib-bundle.sh

      - name: Save SysML stdlib bundle cache
        if: steps.stdlib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/sysml-stdlib-kpar-${{ env.SPEC42_STDLIB_VERSION }}
          key: sysml-stdlib-${{ env.SPEC42_STDLIB_VERSION }}

      - name: Prepare KPAR library bundles
        run: |
          DOMAIN_VERSION=$(node -p "require('./config/libraries/domain.json').version")
          METHOD_VERSION=$(node -p "require('./config/libraries/method.json').version")
          echo "SPEC42_DOMAIN_LIBRARIES_VERSION=${DOMAIN_VERSION}" >> $GITHUB_ENV
          echo "SPEC42_METHOD_LIBRARIES_VERSION=${METHOD_VERSION}" >> $GITHUB_ENV
          echo "SPEC42_KPAR_LIBRARY_BUNDLE_DOMAIN=${{ github.workspace }}/.cache/elan8-domain-libraries-${DOMAIN_VERSION}.kpar" >> $GITHUB_ENV
          echo "SPEC42_KPAR_LIBRARY_BUNDLE_METHOD=${{ github.workspace }}/.cache/elan8-method-libraries-${METHOD_VERSION}.kpar" >> $GITHUB_ENV

      - name: Restore KPAR library bundles cache
        uses: actions/cache/restore@v4
        id: kpar-libraries-cache
        with:
          path: |
            .cache/elan8-domain-libraries-${{ env.SPEC42_DOMAIN_LIBRARIES_VERSION }}.kpar
            .cache/elan8-method-libraries-${{ env.SPEC42_METHOD_LIBRARIES_VERSION }}.kpar
          key: kpar-libraries-domain-${{ env.SPEC42_DOMAIN_LIBRARIES_VERSION }}-method-${{ env.SPEC42_METHOD_LIBRARIES_VERSION }}

      - name: Fetch KPAR library bundles
        if: steps.kpar-libraries-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch-kpar-libraries-bundle.sh

      - name: Save KPAR library bundles cache
        if: steps.kpar-libraries-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/elan8-domain-libraries-${{ env.SPEC42_DOMAIN_LIBRARIES_VERSION }}.kpar
            .cache/elan8-method-libraries-${{ env.SPEC42_METHOD_LIBRARIES_VERSION }}.kpar
          key: kpar-libraries-domain-${{ env.SPEC42_DOMAIN_LIBRARIES_VERSION }}-method-${{ env.SPEC42_METHOD_LIBRARIES_VERSION }}

      - name: Conformance matrix is current
        run: node scripts/generate-conformance-matrix.mjs --check

      - name: Generator ABI manifest and specification are current
        run: |
          cargo run -p spec42-generator-protocol --example abi-manifest > docs/generation/generator-abi.json
          git diff --exit-code docs/generation/generator-abi.json
          node scripts/sync-generator-abi.mjs --check

      - name: Requirements slice integration checks
        run: |
          cargo test -p lsp_server --test lsp_integration integration::feature_inspector::lsp_feature_inspector_resolves_cross_file_typing
          cargo test -p lsp_server --test lsp_integration integration::diagnostics::unresolved_satisfy_reference_emits_semantic_diagnostic

      - name: cargo test (core workspace)
        run: |
          cargo test --workspace --exclude server --exclude lsp_server
          cargo test -p lsp_server --lib --test debt_guardrails --test parse_validation
          # lsp_integration spawns a real server subprocess per test and waits on background
          # async indexing with a wall-clock retry budget; under default parallelism on shared
          # CI runners, contention from many concurrent subprocesses can starve that budget and
          # produce flaky failures that don't reproduce locally. Run it serially here instead.
          cargo test -p lsp_server --test lsp_integration -- --test-threads=1
          cargo test -p server --lib

      - name: SysML fuzz seed regression corpus
        run: cargo test --manifest-path fuzz/Cargo.toml --test sysml_seed_corpus

      - name: Generator conformance corpus
        run: |
          scripts/build-generator-plugins.sh
          cargo run -p generator_conformance --bin generator-conformance
          # A blessed golden must be committed, never produced by CI.
          git diff --exit-code generator-tests/golden
          # Subprocess layer: exit codes, the output transaction and cross-process
          # determinism, none of which the in-process corpus can observe. Must run after the
          # plugins are built or it skips itself.
          cargo test -p server --test generator_cli

      - name: Sandboxed Rust generator smoke
        run: |
          cargo build --release --manifest-path generator-examples/rust/Cargo.toml --target wasm32-unknown-unknown
          cargo run -p server --bin spec42 -- --no-stdlib generate generator-examples/rust/target/wasm32-unknown-unknown/release/spec42_example_generator.wasm vscode/testFixture/workspaces/multi-file/def.sysml --output target/generator-smoke -- target=rust
          cargo run -p server --bin spec42 -- --no-stdlib generate generator-examples/rust/target/wasm32-unknown-unknown/release/spec42_example_generator.wasm vscode/testFixture/workspaces/multi-file/def.sysml --output target/generator-smoke --check -- target=rust

      # Robot-vacuum zero-warning / view smoke stay local-only (`--ignored` tests +
      # scripts/fetch-robot-vacuum-cleaner.sh). The showcase repo already gates
      # Spec42 errors/warnings on its own CI; pinning it here couples Spec42
      # releases to showcase/method drift.

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo doc
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

  rust-surfaces:
    name: Rust agent CLI surfaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Prepare SysML stdlib bundle
        run: |
          VERSION=$(node -p "require('./config/standard-library.json').version")
          echo "SPEC42_STDLIB_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "SPEC42_STDLIB_KPAR_DIR=${{ github.workspace }}/.cache/sysml-stdlib-kpar-${VERSION}" >> $GITHUB_ENV

      - name: Restore SysML stdlib bundle cache
        uses: actions/cache/restore@v4
        id: stdlib-cache
        with:
          path: .cache/sysml-stdlib-kpar-${{ env.SPEC42_STDLIB_VERSION }}
          key: sysml-stdlib-${{ env.SPEC42_STDLIB_VERSION }}

      - name: Fetch SysML stdlib bundle
        if: steps.stdlib-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch-stdlib-bundle.sh

      - name: Save SysML stdlib bundle cache
        if: steps.stdlib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/sysml-stdlib-kpar-${{ env.SPEC42_STDLIB_VERSION }}
          key: sysml-stdlib-${{ env.SPEC42_STDLIB_VERSION }}

      - name: Prepare KPAR library bundles
        run: |
          DOMAIN_VERSION=$(node -p "require('./config/libraries/domain.json').version")
          METHOD_VERSION=$(node -p "require('./config/libraries/method.json').version")
          echo "SPEC42_DOMAIN_LIBRARIES_VERSION=${DOMAIN_VERSION}" >> $GITHUB_ENV
          echo "SPEC42_METHOD_LIBRARIES_VERSION=${METHOD_VERSION}" >> $GITHUB_ENV
          echo "SPEC42_KPAR_LIBRARY_BUNDLE_DOMAIN=${{ github.workspace }}/.cache/elan8-domain-libraries-${DOMAIN_VERSION}.kpar" >> $GITHUB_ENV
          echo "SPEC42_KPAR_LIBRARY_BUNDLE_METHOD=${{ github.workspace }}/.cache/elan8-method-libraries-${METHOD_VERSION}.kpar" >> $GITHUB_ENV

      - name: Restore KPAR library bundles cache
        uses: actions/cache/restore@v4
        id: kpar-libraries-cache
        with:
          path: |
            .cache/elan8-domain-libraries-${{ env.SPEC42_DOMAIN_LIBRARIES_VERSION }}.kpar
            .cache/elan8-method-libraries-${{ env.SPEC42_METHOD_LIBRARIES_VERSION }}.kpar
          key: kpar-libraries-domain-${{ env.SPEC42_DOMAIN_LIBRARIES_VERSION }}-method-${{ env.SPEC42_METHOD_LIBRARIES_VERSION }}

      - name: Fetch KPAR library bundles
        if: steps.kpar-libraries-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch-kpar-libraries-bundle.sh

      - name: Save KPAR library bundles cache
        if: steps.kpar-libraries-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/elan8-domain-libraries-${{ env.SPEC42_DOMAIN_LIBRARIES_VERSION }}.kpar
            .cache/elan8-method-libraries-${{ env.SPEC42_METHOD_LIBRARIES_VERSION }}.kpar
          key: kpar-libraries-domain-${{ env.SPEC42_DOMAIN_LIBRARIES_VERSION }}-method-${{ env.SPEC42_METHOD_LIBRARIES_VERSION }}

      - name: Agent CLI surface integration tests
        run: |
          cargo test -p server \
            --test cli_ai_tools \
            --test kitchen_timer_check \
            --test kpar_stdlib_embed_smoke \
            --test multi_file_check \
            -- --include-ignored

  frontend-unit:
    name: Frontend unit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            shared/diagram-renderer/package-lock.json
            vscode/package-lock.json

      - name: npm ci (diagram renderer)
        run: cd shared/diagram-renderer && npm ci

      - name: npm audit (diagram renderer)
        run: cd shared/diagram-renderer && npm audit --omit=dev

      - name: npm typecheck (diagram renderer)
        run: cd shared/diagram-renderer && npm run typecheck

      - name: npm test (diagram renderer)
        run: cd shared/diagram-renderer && npm test

      - name: npm test:coverage (diagram renderer)
        run: cd shared/diagram-renderer && npm run test:coverage

      - name: npm ci (vscode)
        run: cd vscode && npm ci

      - name: npm audit (vscode)
        run: cd vscode && npm audit --omit=dev

      - name: Typecheck extension
        run: cd vscode && npm run typecheck

      - name: LM CLI argv unit tests
        run: cd vscode && npm run test:lm-cli-unit

      - name: Library view model unit tests
        run: cd vscode && npm run test:library-unit

      - name: UX unit tests
        run: cd vscode && xvfb-run -a npm run test:ux-unit

      - name: Upload frontend failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-artifacts
          if-no-files-found: ignore
          path: |
            vscode/.vscode-test/**
            vscode/test-output/**
            /tmp/spec42-vscode-test-exports/**

  vscode-smoke:
    name: VS Code smoke tests
    runs-on: ubuntu-latest
    env:
      SPEC42_TEST_DEBUG: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: vscode/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Prepare SysML stdlib bundle
        run: |
          VERSION=$(node -p "require('./config/standard-library.json').version")
          echo "SPEC42_STDLIB_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "SPEC42_STDLIB_KPAR_DIR=${{ github.workspace }}/.cache/sysml-stdlib-kpar-${VERSION}" >> $GITHUB_ENV

      - name: Restore SysML stdlib bundle cache
        uses: actions/cache/restore@v4
        id: stdlib-cache
        with:
          path: .cache/sysml-stdlib-kpar-${{ env.SPEC42_STDLIB_VERSION }}
          key: sysml-stdlib-${{ env.SPEC42_STDLIB_VERSION }}

      - name: Fetch SysML stdlib bundle
        if: steps.stdlib-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch-stdlib-bundle.sh

      - name: Save SysML stdlib bundle cache
        if: steps.stdlib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/sysml-stdlib-kpar-${{ env.SPEC42_STDLIB_VERSION }}
          key: sysml-stdlib-${{ env.SPEC42_STDLIB_VERSION }}

      - name: Prepare KPAR library bundles
        run: |
          DOMAIN_VERSION=$(node -p "require('./config/libraries/domain.json').version")
          METHOD_VERSION=$(node -p "require('./config/libraries/method.json').version")
          echo "SPEC42_DOMAIN_LIBRARIES_VERSION=${DOMAIN_VERSION}" >> $GITHUB_ENV
          echo "SPEC42_METHOD_LIBRARIES_VERSION=${METHOD_VERSION}" >> $GITHUB_ENV
          echo "SPEC42_KPAR_LIBRARY_BUNDLE_DOMAIN=${{ github.workspace }}/.cache/elan8-domain-libraries-${DOMAIN_VERSION}.kpar" >> $GITHUB_ENV
          echo "SPEC42_KPAR_LIBRARY_BUNDLE_METHOD=${{ github.workspace }}/.cache/elan8-method-libraries-${METHOD_VERSION}.kpar" >> $GITHUB_ENV

      - name: Restore KPAR library bundles cache
        uses: actions/cache/restore@v4
        id: kpar-libraries-cache
        with:
          path: |
            .cache/elan8-domain-libraries-${{ env.SPEC42_DOMAIN_LIBRARIES_VERSION }}.kpar
            .cache/elan8-method-libraries-${{ env.SPEC42_METHOD_LIBRARIES_VERSION }}.kpar
          key: kpar-libraries-domain-${{ env.SPEC42_DOMAIN_LIBRARIES_VERSION }}-method-${{ env.SPEC42_METHOD_LIBRARIES_VERSION }}

      - name: Fetch KPAR library bundles
        if: steps.kpar-libraries-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch-kpar-libraries-bundle.sh

      - name: Save KPAR library bundles cache
        if: steps.kpar-libraries-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/elan8-domain-libraries-${{ env.SPEC42_DOMAIN_LIBRARIES_VERSION }}.kpar
            .cache/elan8-method-libraries-${{ env.SPEC42_METHOD_LIBRARIES_VERSION }}.kpar
          key: kpar-libraries-domain-${{ env.SPEC42_DOMAIN_LIBRARIES_VERSION }}-method-${{ env.SPEC42_METHOD_LIBRARIES_VERSION }}

      - name: Build server (debug for extension test host)
        run: cargo build -p server

      - name: Configure server path
        run: |
          echo "${{ github.workspace }}/target/debug" >> $GITHUB_PATH
          if [ -x "${{ github.workspace }}/target/debug/spec42" ]; then
            chmod +x "${{ github.workspace }}/target/debug/spec42" || true
            echo "SPEC42_SERVER_PATH=${{ github.workspace }}/target/debug/spec42" >> $GITHUB_ENV
            echo "SPEC42_SERVER_PATH set to debug binary"
          else
            echo "spec42 debug binary not found"
            ls -la "${{ github.workspace }}/target/debug" || true
            exit 1
          fi

      - name: Diagnose server binary
        run: |
          echo "SPEC42_SERVER_PATH=${SPEC42_SERVER_PATH:-"(unset)"}"
          ls -la "${SPEC42_SERVER_PATH}"
          file "${SPEC42_SERVER_PATH}" || true
          ldd "${SPEC42_SERVER_PATH}" || true
          "${SPEC42_SERVER_PATH}" --version || true

      - name: npm ci (vscode)
        run: cd vscode && npm ci

      - name: Build extension
        run: cd vscode && npm run compile

      - name: npm test (extension smoke)
        run: cd vscode && xvfb-run -a npm test

      - name: npm test (multi-file smoke)
        run: cd vscode && xvfb-run -a npm run test:multi-file

      - name: npm test (server restart smoke)
        run: cd vscode && xvfb-run -a npm run test:server-restart

      - name: Upload VS Code smoke failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-smoke-artifacts
          if-no-files-found: ignore
          path: |
            vscode/.vscode-test/**
            vscode/test-output/**
            /tmp/spec42-vscode-test-exports/**

  package-smoke:
    name: VSIX package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: vscode/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Prepare SysML stdlib bundle
        run: |
          VERSION=$(node -p "require('./config/standard-library.json').version")
          echo "SPEC42_STDLIB_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "SPEC42_STDLIB_KPAR_DIR=${{ github.workspace }}/.cache/sysml-stdlib-kpar-${VERSION}" >> $GITHUB_ENV

      - name: Restore SysML stdlib bundle cache
        uses: actions/cache/restore@v4
        id: stdlib-cache
        with:
          path: .cache/sysml-stdlib-kpar-${{ env.SPEC42_STDLIB_VERSION }}
          key: sysml-stdlib-${{ env.SPEC42_STDLIB_VERSION }}

      - name: Fetch SysML stdlib bundle
        if: steps.stdlib-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch-stdlib-bundle.sh

      - name: Save SysML stdlib bundle cache
        if: steps.stdlib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/sysml-stdlib-kpar-${{ env.SPEC42_STDLIB_VERSION }}
          key: sysml-stdlib-${{ env.SPEC42_STDLIB_VERSION }}

      - name: Prepare KPAR library bundles
        run: |
          DOMAIN_VERSION=$(node -p "require('./config/libraries/domain.json').version")
          METHOD_VERSION=$(node -p "require('./config/libraries/method.json').version")
          echo "SPEC42_DOMAIN_LIBRARIES_VERSION=${DOMAIN_VERSION}" >> $GITHUB_ENV
          echo "SPEC42_METHOD_LIBRARIES_VERSION=${METHOD_VERSION}" >> $GITHUB_ENV
          echo "SPEC42_KPAR_LIBRARY_BUNDLE_DOMAIN=${{ github.workspace }}/.cache/elan8-domain-libraries-${DOMAIN_VERSION}.kpar" >> $GITHUB_ENV
          echo "SPEC42_KPAR_LIBRARY_BUNDLE_METHOD=${{ github.workspace }}/.cache/elan8-method-libraries-${METHOD_VERSION}.kpar" >> $GITHUB_ENV

      - name: Restore KPAR library bundles cache
        uses: actions/cache/restore@v4
        id: kpar-libraries-cache
        with:
          path: |
            .cache/elan8-domain-libraries-${{ env.SPEC42_DOMAIN_LIBRARIES_VERSION }}.kpar
            .cache/elan8-method-libraries-${{ env.SPEC42_METHOD_LIBRARIES_VERSION }}.kpar
          key: kpar-libraries-domain-${{ env.SPEC42_DOMAIN_LIBRARIES_VERSION }}-method-${{ env.SPEC42_METHOD_LIBRARIES_VERSION }}

      - name: Fetch KPAR library bundles
        if: steps.kpar-libraries-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch-kpar-libraries-bundle.sh

      - name: Save KPAR library bundles cache
        if: steps.kpar-libraries-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/elan8-domain-libraries-${{ env.SPEC42_DOMAIN_LIBRARIES_VERSION }}.kpar
            .cache/elan8-method-libraries-${{ env.SPEC42_METHOD_LIBRARIES_VERSION }}.kpar
          key: kpar-libraries-domain-${{ env.SPEC42_DOMAIN_LIBRARIES_VERSION }}-method-${{ env.SPEC42_METHOD_LIBRARIES_VERSION }}

      - name: Build server (release for packaging)
        run: cargo build --release -p server

      - name: Configure packaged server path
        run: |
          echo "${{ github.workspace }}/target/release" >> $GITHUB_PATH
          if [ -x "${{ github.workspace }}/target/release/spec42" ]; then
            chmod +x "${{ github.workspace }}/target/release/spec42" || true
            echo "SPEC42_SERVER_PATH=${{ github.workspace }}/target/release/spec42" >> $GITHUB_ENV
            echo "SPEC42_SERVER_PATH set to release binary"
          else
            echo "spec42 release binary not found"
            ls -la "${{ github.workspace }}/target/release" || true
            exit 1
          fi

      - name: npm ci (vscode)
        run: cd vscode && npm ci

      - name: Build extension
        run: cd vscode && npm run compile

      - name: Package VSIX
        run: cd vscode && npm run package

      - name: Smoke test packaged VSIX activation
        run: |
          cd vscode
          xvfb-run -a node scripts/smoke-vsix-activation.js \
            --vsix "spec42-*.vsix" \
            --workspace "testFixture/workspaces/single-file" \
            --doc "testFixture/workspaces/single-file/SurveillanceDrone.sysml" \
            --server-path "${SPEC42_SERVER_PATH}"

      - name: Upload package smoke failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-smoke-artifacts
          if-no-files-found: ignore
          path: |
            vscode/*.vsix
            vscode/.vscode-test/**
            vscode/test-output/**
            /tmp/spec42-vscode-test-exports/**

  zed-extension:
    name: Zed extension build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: wasm32-wasip2

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo check (zed extension)
        run: cargo check --manifest-path zed/Cargo.toml --target wasm32-wasip2 --release

  generator-policy-platforms:
    name: Generator policy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Only the crates whose behaviour depends on the filesystem: artifact path validation
      # (case folding, Unicode normalization, device names, alternate data streams) and the
      # transaction planner and executor. On Windows this also runs the differential test
      # that uses the platform itself as the oracle for what a valid filename is.
      #
      # `server`'s default features re-enable `workspace`'s embedded stdlib/KPAR libraries
      # (correct for the shipped CLI, irrelevant to path/transaction-policy behaviour), and this
      # job never fetches those bundles -- `--no-default-features` keeps it building the
      # lightweight path this job actually needs, matching what its own tests exercise.
      - name: Artifact path and transaction policy
        run: |
          cargo test -p generator_api --lib path
          cargo test -p generator_api --lib artifacts
          cargo test -p server --lib generation::plan --no-default-features
          cargo test -p server --lib generation::apply --no-default-features
