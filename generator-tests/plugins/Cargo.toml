# Nested workspace: these crates target wasm32-unknown-unknown only, so they must stay out
# of the root workspace or `cargo clippy --workspace` would try to build them for the host.
[workspace]
resolver = "2"
members = ["query_all", "diagnostics", "error_guest", "empty", "artifact_paths", "find_all"]

[workspace.dependencies]
spec42-generator-sdk = { path = "../../crates/generator_sdk" }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
codegen-units = 1
