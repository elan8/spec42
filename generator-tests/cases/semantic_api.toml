# Pins the observable shape of the semantic query surface.

[defaults]
model = "coverage"
plugin = "query_all"
expect = "success"

[[case]]
id = "semantic-api/all-operations"
description = """
Calls every query operation over the coverage model and writes a normalised transcript.
This is the primary golden for the semantic API: a change to result ordering, metaclass
strings, relationship kinds or ElementDetail defaulting shows up here as a reviewable diff.
"""
assert = { output_files = 1 }

[[case]]
id = "semantic-api/effective-feature-shadowing"
model = "inheritance"
description = """
Direct features precede inherited ones, inheritance is nearest-first, and a same-named
nearer feature shadows a farther one. This case is that rule, executable.
"""

[[case]]
id = "semantic-api/minimal-model"
model = "minimal"
description = "The smallest model that still exercises every operation."

[[case]]
id = "semantic-api/wide-find-all"
model = "wide"
plugin = "find_all"
description = """
A single find(None) over ~1200 elements. Exists to make the cost of the element-exposure
path visible: every element crossing the boundary is hashed, allocated and copied.
"""

[[case]]
id = "semantic-api/wide-find-all-metered"
model = "wide"
plugin = "find_all"
meter_fuel = true
assert = { fuel_consumed = 9_602_254, query_count = 1 }
description = """
The fuel-regression signal, active rather than documented. fuel_consumed is an exact
instruction count, so an unchanged plugin whose fuel moves means Spec42 changed how much
work a guest does -- which is the alarm the corpus exists to raise. Without a case setting
meter_fuel every golden records null and the signal is dormant.

fuel_consumed is only ever measured and enforced by the `rust-core` CI job (ubuntu-latest) --
the windows-latest/macos-latest generator-policy jobs never run this corpus, so this stays
deterministic in CI itself. It is NOT safe to bless from a non-Linux machine, though:
`--remap-path-prefix` (scripts/build-generator-plugins.sh) normalizes the remapped path
*prefix* embedded in the guest .wasm, but not the OS-native separator in the remainder of the
path (backslash on Windows vs forward slash on Linux), so a Windows-built guest embeds different bytes than a
Linux one and reports a different exact fuel count for the identical source. Always bless
this value from CI's own measurement (or a Linux build), never from a local Windows/macOS run.
"""
