schema_version = 1

[[issue]]
id = "lowering-gap-binding-connector-satisfy-requirement-endpoints"
kind = "lowering_gap"
owner = "spec42-semantic"
summary = "checkSatisfyRequirementUsageBindingConnector requires exactly one owned BindingConnector relating subjectParameter to another element even when `by` is omitted, but neither the spec nor the Pilot defines it then: the Pilot binds only through the `by` SatisfactionParameter's FeatureValue (UsageAdapter.computeValueConnector), as a member of that parameter rather than of the SatisfyRequirementUsage, and creates none without `by`. spec42 also does not lower the SatisfactionSubjectMember as the usage's subject parameter."

