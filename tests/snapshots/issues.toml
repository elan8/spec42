kind = "abstract_syntax_coverage_gap"
owner = "spec42-snapshot"
summary = "KerML `EndFeaturePrefix` spells only `const? end` and `var` lives in the exclusive BasicFeaturePrefix alternative, so a KerML variable non-constant end feature has no spelling (the parser reports `var end feature` as end_feature_invalid_prefix). SysML is not covered by that argument: an end Usage's isVariable is the derived mayTimeVary, which is true for an end of an occurrence-typed owner such as a connection definition, and EndUsagePrefix has no `constant` slot, so the literal OCL would reject every such end; the Pilot does not enforce validateFeatureEndIsConstant, and the SysML case needs an OMG decision before a violating fixture can be authored"

[[issue]]
id = "lowering-gap-kerml-relationship-declarations"
kind = "lowering_gap"
owner = "spec42-semantic"
summary = "the standalone KerML relationship declarations (`specialization`/`subclassifier`/`subtype`/`typing`/`subset`/`redefinition`/`disjoining`/`inverting`/`featuring`/`conjugation`, ast::KermlRelationshipDecl) are typed upstream but lower_package_element reports them as unsupported_package_member, so a Specialization whose specific type is conjugated never reaches validateSpecializationSpecificNotConjugated"

[[issue]]
id = "lowering-gap-binding-connector-accept-receiver-endpoints"
kind = "lowering_gap"
owner = "spec42-semantic"
summary = "AcceptActionUsage receiver-argument and receiver-parameter endpoint facts are not jointly published with canonical BindingConnector pairs, preventing checkAcceptActionUsageReceiverBindingConnector; the `accept when`/`accept at` triggers themselves now parse and lower"

[[issue]]
id = "semantic-trigger-invocation-argument-typing"
kind = "semantic_not_implemented"
owner = "spec42-semantic"
summary = "no semantic rule classifies a TriggerInvocationExpression argument as Boolean, ISQBase::DurationValue or Time::TimeInstantValue; the `accept when`/`accept at`/`accept after` triggers parse and lower, but the canonical codes trigger_when_argument_not_boolean, trigger_at_argument_not_time_instant and trigger_after_argument_not_duration do not exist yet"

[[issue]]
id = "lowering-gap-state-usage-specialization-facts"
kind = "lowering_gap"
owner = "spec42-semantic"
summary = "StateUsage isParallel is now published as the `parallel` modifier, but the StateSubactionKind role and library-anchor facts that checkStateUsageExclusiveStateSpecialization and checkStateUsageSubstateSpecialization evaluate over are not jointly published (specialization_check prerequisite StateSubactionKindAndLibraryAnchor)"

[[issue]]
id = "semantic-feature-chaining-rules"
kind = "semantic_not_implemented"
owner = "spec42-semantic"
summary = "a `chains` clause lowers and resolves as a featureChaining relationship, but no semantic rule counts chaining features, checks that each is featured within the previous, or rejects a self-chain; the canonical codes feature_chaining_single_operand, feature_chaining_not_featured_within_previous and feature_chaining_includes_self do not exist yet"

[[issue]]
id = "semantic-library-specialization-metaclass-generalization"
kind = "semantic_not_implemented"
owner = "spec42-semantic"
summary = "generated specializesFromLibrary rules match the exact metaclass only, so rules declared on Succession, BindingConnector, SuccessionFlow and ControlNode never reach SuccessionAsUsage, BindingConnectorAsUsage, SuccessionFlowUsage or ForkNode (the Pilot ImplicitGeneralizationMap applies them); widening only Succession to SuccessionAsUsage made standard-library construction fail, `succession flow` lowers to the same declaration kind as `flow`, and the XMI anchor for checkControlNodeSpecialization is spelled Action::Action::controls with no recorded OMG correction"
