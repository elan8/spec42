[[issue]]
id = "abstract-syntax-nonrepresentable-second-conjugation"
kind = "abstract_syntax_coverage_gap"
owner = "spec42-snapshot"
summary = "KerML `ConjugationPart = ( 'conjugates' | '~' ) OwnedConjugation` (BNF 462) admits one owned Conjugation per type declaration, so a second `conjugates` clause has no concrete-syntax spelling; the pinned parser reports `classifier Two conjugates A conjugates B;` as unsupported_grammar_form and the violating Type never reaches semantics"

[[issue]]
id = "abstract-syntax-nonrepresentable-variable-end"
kind = "abstract_syntax_coverage_gap"
owner = "spec42-snapshot"
summary = "KerML's `EndFeaturePrefix` spells only `const? end` and `var` lives in the exclusive `BasicFeaturePrefix` alternative, while SysML's `RefPrefix` has no `var`/`variable` slot, so a variable end feature has no concrete-syntax spelling; the pinned parser reports `var end feature` as end_feature_invalid_prefix and the violating Feature never reaches semantics"

