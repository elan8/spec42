[[issue]]
id = "abstract-syntax-library-specialization-metaclasses"
kind = "abstract_syntax_coverage_gap"
owner = "spec42-snapshot"
summary = "LiteralExpression, LiteralBoolean, LiteralInteger, LiteralRational, LiteralInfinity, LiteralString, NullExpression and MetadataAccessExpression instances are expression-tree nodes inside an authored expression; they are never lowered to declarations with a canonical element identity (named or anonymous), so neither a qualified name nor an anonymous owner-scoped reference can address them for an implied-specialization assertion"

[[issue]]
id = "abstract-syntax-annotation-identity"
kind = "abstract_syntax_coverage_gap"
owner = "spec42-snapshot"
summary = "KerML concrete syntax cannot author an Annotation with neither or both of ownedAnnotatingElement and owningAnnotatingElement, but no evidence can be cited: lowering publishes documentation/comment text as DocumentationRecord rows on a declaration, not as Annotation relationships with annotatingElement/annotatedElement identities, and `comment about Thing` is recorded against the owning package rather than Thing"

[[issue]]
id = "parser-gap-directed-control-node"
kind = "parser_gap"
owner = "sysml-v2-parser"
summary = "SysML ControlNodePrefix is RefPrefix (direction, derived, abstract/variation, constant) plus individual/portion, so `in fork g;` is grammatical and denotes a non-composite (referential) control node, but the pinned parser reports it as recovered_action_body_element; once it parses, spec42 also needs the effective Usage::isComposite (false for a directed or end usage, Pilot UsageAdapter.postProcess) and a control_node_not_composite rule"

[[issue]]
id = "parser-gap-kerml-multiplicity-member"
kind = "parser_gap"
owner = "sysml-v2-parser"
summary = "KerML TypeBody admits a NonFeatureMember whose element is a Multiplicity (`multiplicity extra [2];`), giving a type a second owned Multiplicity, but the pinned parser reads that member in a classifier body as a result expression with two unresolved operands instead of a Multiplicity; once it parses, spec42 needs an owned-Multiplicity count over the classifier's multiplicity fact plus Multiplicity members and a type_multiple_multiplicities rule"

