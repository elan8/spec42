schema_version = 1

[[issue]]
id = "lowering-gap-type-feature-membership-identity"
kind = "lowering_gap"
owner = "spec42-semantic"
summary = "FeatureMembership is compact declaration-aligned storage (one membership row per member), not an independently addressable relationship identity, so deriveTypeOwnedFeatureMembership cannot publish its normative relationship result. Publishing Membership relationships as identities is a storage representation change that design.md admits only with the standard-library benchmark set."

[[issue]]
id = "lowering-gap-redefinition-flow-end-library-anchors"
kind = "lowering_gap"
owner = "spec42-semantic"
summary = "Flow endpoints (`flow from a.x to b.y`, KerML `flow ... from ... to`) lower as bare FlowSource/FlowTarget connector ends: one reference to the whole chain, sourced at the flow, which is the end's relatedFeature and what the diagram, generator-protocol and connector checks read. checkFeatureFlowFeatureRedefinition needs the grammar's FlowEnd structure instead -- a declared FlowEnd whose ReferenceSubsetting is the chain prefix (`a`), owning a flow feature that redefines the last segment (`x`) and Transfers::Transfer::source::sourceOutput / target::targetInput -- which splits each end reference in two and moves it off the flow, so every FlowSource/FlowTarget consumer must move with it in one change."

[[issue]]
id = "lowering-gap-redefinition-view-rendering-membership"
kind = "lowering_gap"
owner = "spec42-semantic"
summary = "The pinned parser's ViewRenderingUsage AST drops whether the `rendering` keyword was written and parses the ReferenceSubsetting shorthand target (`render asTreeDiagram;`) as a declared name, so lowering cannot publish the ViewRenderingMembership RenderingUsage (or its reference) faithfully for checkRenderingUsageRedefinition; `render` members stay unsupported syntax."

[[issue]]
id = "lowering-gap-binding-connector-satisfy-requirement-endpoints"
kind = "lowering_gap"
owner = "spec42-semantic"
summary = "checkSatisfyRequirementUsageBindingConnector requires exactly one owned BindingConnector relating subjectParameter to another element even when `by` is omitted, but neither the spec nor the Pilot defines it then: the Pilot binds only through the `by` SatisfactionParameter's FeatureValue (UsageAdapter.computeValueConnector), as a member of that parameter rather than of the SatisfyRequirementUsage, and creates none without `by`. spec42 also does not lower the SatisfactionSubjectMember as the usage's subject parameter."

[[issue]]
id = "normative-specification-gap-constructor-expression-result-default-value-binding-connector"
kind = "normative_specification_gap"
owner = "omg-specification"
summary = "Pinned KerML XMI body for checkConstructorExpressionResultDefaultValueBindingConnector is exactly TBD (SHA-256 036265965ea6cd2b1d3d5c8d44f9e719188af11d63d0b6ef158a5d77dfb26e30), and the Pilot implements no counterpart (no adapter satisfies it); OMG must publish an evaluable normative predicate."

[[issue]]
id = "normative-specification-gap-invocation-expression-default-value-binding-connector"
kind = "normative_specification_gap"
owner = "omg-specification"
summary = "Pinned KerML XMI body for checkInvocationExpressionDefaultValueBindingConnector is exactly TBD (SHA-256 036265965ea6cd2b1d3d5c8d44f9e719188af11d63d0b6ef158a5d77dfb26e30), and the Pilot implements no counterpart (no adapter satisfies it); OMG must publish an evaluable normative predicate."

[[issue]]
id = "library-gap-join-node-specialization-anchor"
kind = "library_gap"
owner = "spec42-libraries"
summary = "checkJoinNodeSpecialization (clause 8.3.17.11) carries the OCL anchor Actions::Action::join, which the standard library does not publish; the constraint's own normative prose, the library (Actions::Action::joins), and the Pilot ImplicitGeneralizationMap all use Actions::Action::joins. Applying that correction needs an official OMG issue for library_anchor_corrections (specifications/README.md), and none is recorded yet."

[[issue]]
id = "normative-specification-gap-include-use-case-specialization-body"
kind = "normative_specification_gap"
owner = "omg-specification"
summary = "Pinned SysML XMI body for checkIncludeUseCaseSpecialization is unbalanced (SHA-256 8b33230184c8a490deb83f00690fd7b9daae07e37f47bd714a7deb48d69fc01a); OMG must publish an evaluable predicate before a specialization contract can be derived."

[[issue]]
id = "normative-specification-gap-step-owned-performance-specialization-body"
kind = "normative_specification_gap"
owner = "omg-specification"
summary = "Pinned KerML XMI body for checkStepOwnedPerformanceSpecialization is unbalanced (SHA-256 899aa2a17a9527d1b448a84bc4a336a933bc6b067fb99ff9095bd5a866854bd8); OMG must publish an evaluable predicate before a specialization contract can be derived."

[[issue]]
id = "lowering-gap-library-specialization-forms"
kind = "lowering_gap"
owner = "spec42-semantic"
summary = "The pinned parser reads a namespace-level `connection X;`, `interface X;` and `calc X;` as ConnectionDef/InterfaceDef/CalcDef (the `def` keyword is optional there), so they lower as definitions and take the definition anchors instead of checkConnectionUsage/InterfaceUsage/CalculationUsageSpecialization; and a SysML `metadata` usage publishes only the MetadataUsage metaclass, whose nearer Metadata::metadataItems rule shadows the KerML checkMetadataFeatureSpecialization anchor Metaobjects::metaobjects, so the KerML MetadataFeature form needs its own published metaclass."

[[issue]]
id = "semantic-connector-binary-object-specialization-contract"
kind = "semantic_not_implemented"
owner = "spec42-semantic"
summary = "The owned connectorEnd collection is now canonical (SemanticModelStorage::owned_end_features), but the pinned manifest classifies checkConnectorBinaryObjectSpecialization as a specialization_check: the extractor rejects its compound XMI body (`connectorEnds->size() = 2 and association->exists(oclIsKindOf(AssociationStructure))`, note the XMI spelling `connectorEnds`), so no conditional contract or Objects::binaryLinkObjects anchor is generated to synthesize from. Needs extractor support for the compound predicate and an XMI-backed manifest refresh."

[[issue]]
id = "abstract-syntax-literal-infinity-identity"
kind = "abstract_syntax_coverage_gap"
owner = "spec42-snapshot"
summary = "KerML LiteralExpression admits `*` (LiteralInfinity) wherever an expression is written, but the pinned sysml-v2-parser publishes no ast::Expression node for it (a `[*]` bound is an absent node, and `feature x = *;` is reported as an unsupported feature declaration), so lowering mints no LiteralInfinity element for checkLiteralInfinitySpecialization to be asserted against"

[[issue]]
id = "abstract-syntax-annotation-identity"
kind = "abstract_syntax_coverage_gap"
owner = "spec42-snapshot"
summary = "KerML concrete syntax cannot author an Annotation with neither or both of ownedAnnotatingElement and owningAnnotatingElement, but no evidence can be cited: lowering publishes documentation/comment text as DocumentationRecord rows on a declaration, not as Annotation relationships with annotatingElement/annotatedElement identities, and `comment about Thing` is recorded against the owning package rather than Thing"

[[issue]]
id = "parser-gap-directed-control-node"
kind = "parser_gap"
owner = "sysml-v2-parser"
summary = "SysML ControlNodePrefix is RefPrefix (direction, derived, abstract/variation, constant) plus individual/portion, so `in fork g;` is grammatical and denotes a non-composite (referential) control node, but the pinned parser reports it as recovered_action_body_element; once it parses, spec42 also needs the effective Usage::isComposite (false for a directed or end usage, Pilot UsageAdapter.postProcess) and a control_node_not_composite rule"

[[issue]]
id = "parser-gap-kerml-multiplicity-member"
kind = "parser_gap"
owner = "sysml-v2-parser"
summary = "KerML TypeBody admits a NonFeatureMember whose element is a Multiplicity (`multiplicity extra [2];`), giving a type a second owned Multiplicity, but the pinned parser reads that member in a classifier body as a result expression with two unresolved operands instead of a Multiplicity; once it parses, spec42 needs an owned-Multiplicity count over the classifier's multiplicity fact plus Multiplicity members and a type_multiple_multiplicities rule"

[[issue]]
id = "lowering-conjugated-port-definition"
kind = "lowering_gap"
owner = "spec42-semantic"
summary = "ConjugatedPortDefinition is not published as a distinct declaration, so neither side of the rule can be observed in SMG"

[[issue]]
id = "lowering-kerml-feature-relationships"
kind = "lowering_gap"
owner = "spec42-semantic"
summary = "crosses targets resolve and validateCrossSubsetting{CrossingFeature,CrossedFeature} are checked, but Feature::crossFeature (the second chaining feature of an end feature's owned CrossSubsetting) is not derived, so validateFeatureCrossFeatureType/Specialization and checkFeatureOwnedCrossFeatureTypeFeaturing have no operand; those fixtures also cross from non-end features, which the crossing-feature rule rejects, and must move to end features when the derivation lands. A FeatureChainExpression whose target is not featured by its argument's result settles as unresolved_reference in resolution rather than as a typed targetFeature for validateFeatureChainExpressionConformance."

[[issue]]
id = "lowering-metadata-expressions"
kind = "lowering_gap"
owner = "spec42-semantic"
summary = "a metadata access expression (`Thing.metadata`, ast::Expression::MetadataAccess) parses but lowering reports it as unsupported_calc_definition_member, so no MetadataAccessExpression reaches semantics. Its referencedElement must resolve through a reference kind of its own -- not ExpressionOperand, whose target must be a Feature -- and a new reference kind is a relationship kind of the diagram and generator-protocol contracts"

[[issue]]
id = "lowering-metadata-feature-facts"
kind = "lowering_gap"
owner = "spec42-semantic"
summary = "validateMetadataFeatureAnnotatedElement compares each annotated element's abstract-syntax metaclass with the types of the metaclass's annotatedElement redefinitions (KerML::Classifier, SysML::PartUsage, ...), but no canonical mapping relates a published ElementKind to its reflective KerML/SysML library metaclass declaration, so metadata_annotated_element_incompatible cannot be decided"

[[issue]]
id = "lowering-result-expression-memberships"
kind = "lowering_gap"
owner = "spec42-semantic"
summary = "the publication does not record a ResultExpressionMembership -- a body result expression is only an evaluation site of its owner -- and it cannot count them from the parser's Expression body elements, which also carry members the pinned parser shreds into stray expressions (planning/UPSTREAM_PARSER_GAPS.md body-member-expression-shredding: `attribute a : T;` in a constraint def body, `protected in c : C;` in a KerML class body); counting them reports multiple_result_expressions on conforming corpus models"

[[issue]]
id = "lowering-view-rendering-membership"
kind = "lowering_gap"
owner = "spec42-semantic"
summary = "a render member parses but sysml_resolution reports it as unsupported_view_definition_member, so no ViewRenderingMembership reaches semantics"

[[issue]]
id = "semantic-attribute-feature-composite"
kind = "semantic_not_implemented"
owner = "spec42-semantic"
summary = "validateAttributeDefinitionFeatures/validateAttributeUsageFeatures (feature->forAll(not isComposite)) conflicts with the standard library, whose attribute definitions own composite assert-constraint and calc usages (MeasurementReferences, Time, Quantities); the Pilot disables both checks pending KERML-4 composite semantics, so attribute_feature_composite is not reported until that OMG resolution settles which composite features the rule admits"

[[issue]]
id = "semantic-filter-condition-not-model-level-evaluable"
kind = "semantic_not_implemented"
owner = "spec42-semantic"
summary = "no canonical Expression::modelLevelEvaluable fact exists: deciding it needs the referent rules over the classified expression tree (featuring types, metaclass/metadata owners, value expressions, cycle detection) and each invoked library Function's isModelLevelEvaluable, so filter_condition_not_model_level_evaluable cannot be reported yet"

[[issue]]
id = "semantic-multiplicity-bound-result-type"
kind = "semantic_not_implemented"
owner = "spec42-semantic"
summary = "multiplicity_bound_invalid covers negative literal bounds only: a non-literal or non-integer bound is published as MultiplicityBound::Expression with no result type, so the ScalarValues::Integer result-type half of validateMultiplicityRangeBoundResultTypes is unanswered"

[[issue]]
id = "abstract-syntax-nonrepresentable-second-conjugation"
kind = "abstract_syntax_coverage_gap"
owner = "spec42-snapshot"
summary = "KerML `ConjugationPart = ( 'conjugates' | '~' ) OwnedConjugation` (BNF 462) admits one owned Conjugation per type declaration, and a Conjugation declared as a body member is owned through an OwningMembership rather than the type's ownedRelationship, so a second owned Conjugation has no concrete-syntax spelling; no executable evidence can be cited yet because the pinned parser reports `classifier Two conjugates A conjugates B;` as unsupported_grammar_form (the unsupported_syntax category, i.e. valid-but-unimplemented) rather than malformed_syntax, so a rejection fixture would misstate the source intent"

[[issue]]
id = "abstract-syntax-nonrepresentable-variable-end"
kind = "abstract_syntax_coverage_gap"
owner = "spec42-snapshot"
summary = "KerML `EndFeaturePrefix` spells only `const? end` and `var` lives in the exclusive BasicFeaturePrefix alternative, so a KerML variable non-constant end feature has no spelling (the parser reports `var end feature` as end_feature_invalid_prefix). SysML is not covered by that argument: an end Usage's isVariable is the derived mayTimeVary, which is true for an end of an occurrence-typed owner such as a connection definition, and EndUsagePrefix has no `constant` slot, so the literal OCL would reject every such end; the Pilot does not enforce validateFeatureEndIsConstant, and the SysML case needs an OMG decision before a violating fixture can be authored"

[[issue]]
id = "lowering-gap-binding-connector-accept-receiver-endpoints"
kind = "lowering_gap"
owner = "spec42-semantic"
summary = "checkAcceptActionUsageReceiverBindingConnector binds the AcceptActionUsage's second parameter (`receiver`) to the second parameter of its TriggerInvocationExpression payload argument. `accept when|at|after` now lowers its TriggerInvocationExpression element with its kind, but the accept action still owns no payload or receiver parameter (AcceptParameterPart's PayloadParameterMember / `via` NodeParameterMember), and the expression's second parameter is not owned: the grammar gives a TriggerExpression one ArgumentMember, and the Pilot's addReceiverBinding binds only an owned second parameter (TypeUtil.getOwnedParameterOf(target, 1)), so which Feature the OCL's invocation.parameter->at(2) (an inherited TriggerWhen/At/After::receiver) denotes as a binding end needs a normative decision before it can be lowered."

[[issue]]
id = "semantic-feature-chaining-featured-within"
kind = "semantic_not_implemented"
owner = "spec42-semantic"
summary = "feature_chaining_not_featured_within_previous does not exist: the member-access resolver looks each `.` hop up only among the owned and inherited members of the previous hop's types, so a chaining feature not featured within the previous one is reported unresolved_reference instead of resolving; a settled violation needs a hop visible through the previous hop's imports, which that resolver does not consult"
