[[issue]]
id = "semantic-attribute-feature-composite"
kind = "semantic_not_implemented"
owner = "spec42-semantic"
summary = "validateAttributeDefinitionFeatures/validateAttributeUsageFeatures (feature->forAll(not isComposite)) conflicts with the standard library, whose attribute definitions own composite assert-constraint and calc usages (MeasurementReferences, Time, Quantities); the Pilot disables both checks pending KERML-4 composite semantics, so attribute_feature_composite is not reported until that OMG resolution settles which composite features the rule admits"

[[issue]]
id = "abstract-syntax-nonrepresentable-second-conjugation"
kind = "abstract_syntax_coverage_gap"
owner = "spec42-snapshot"
summary = "KerML `ConjugationPart = ( 'conjugates' | '~' ) OwnedConjugation` (BNF 462) admits one owned Conjugation per type declaration, and a Conjugation declared as a body member is owned through an OwningMembership rather than the type's ownedRelationship, so a second owned Conjugation has no concrete-syntax spelling; no executable evidence can be cited yet because the pinned parser reports `classifier Two conjugates A conjugates B;` as unsupported_grammar_form (the unsupported_syntax category, i.e. valid-but-unimplemented) rather than malformed_syntax, so a rejection fixture would misstate the source intent"

[[issue]]
id = "abstract-syntax-nonrepresentable-variable-end"
kind = "abstract_syntax_coverage_gap"
owner = "spec42-snapshot"
summary = "KerML `EndFeaturePrefix` spells only `const? end` and `var` lives in the exclusive BasicFeaturePrefix alternative, so a KerML variable non-constant end feature has no spelling (the parser reports `var end feature` as end_feature_invalid_prefix). SysML is not covered by that argument: an end Usage's isVariable is the derived mayTimeVary, which is true for an end of an occurrence-typed owner such as a connection definition, and EndUsagePrefix has no `constant` slot, so the literal OCL would reject every such end; the Pilot does not enforce validateFeatureEndIsConstant, and the SysML case needs an OMG decision before a violating fixture can be authored"

[[issue]]
id = "lowering-gap-binding-connector-accept-receiver-endpoints"
kind = "lowering_gap"
owner = "spec42-semantic"
summary = "checkAcceptActionUsageReceiverBindingConnector binds the AcceptActionUsage's second parameter (`receiver`) to the second parameter of its TriggerInvocationExpression payload argument. `accept when|at|after` now lowers its TriggerInvocationExpression element with its kind, but the accept action still owns no payload or receiver parameter (AcceptParameterPart's PayloadParameterMember / `via` NodeParameterMember), and the expression's second parameter is not owned: the grammar gives a TriggerExpression one ArgumentMember, and the Pilot's addReceiverBinding binds only an owned second parameter (TypeUtil.getOwnedParameterOf(target, 1)), so which Feature the OCL's invocation.parameter->at(2) (an inherited TriggerWhen/At/After::receiver) denotes as a binding end needs a normative decision before it can be lowered."

