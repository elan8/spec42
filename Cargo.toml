[workspace]
resolver = "2"
members = [
  "crates/diagram",
  "crates/generator_api",
  "crates/generator_conformance",
  "crates/generator_host",
  "crates/generator_protocol",
  "crates/generator_sdk",
  "crates/language_service",
  "crates/lsp_server",
  "crates/kpar",
  "crates/server",
  "crates/source_identity",
  "crates/sysml_diagnostics",
  "crates/sysml_model",
  "crates/sysml_query",
  "crates/sysml_resolution",
  "crates/workspace",
  "crates/sysml_tokens",
  "crates/workspace_session",
  "tools/snapshot_tool",
  "tools/resolution_benchmark",
  "tools/semantic_benchmark",
]

[workspace.package]
version = "0.50.0"
edition = "2021"
authors = ["Elan8"]
license = "MIT"

[profile.profiling]
inherits = "release"
debug = true

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
postcard-schema = { version = "0.2", default-features = false, features = ["derive", "alloc"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
petgraph = { version = "0.8", features = ["serde-1"] }
sha2 = "0.10"
blake3 = "1"
sysml-v2-parser = { version = "0.54.0", features = ["serde"] }
sysml-v2-parser-next = { git = "https://github.com/lukewilliamboswell/sysml-v2-parser.git", rev = "7d4fd858a65cfcf23296dfd3862fc8646e5224dd", package = "sysml-v2-parser", features = ["serde"] }
ts-rs = { version = "11", features = ["serde-compat", "serde-json-impl"] }
zstd = "0.13"
