[package]
name = "spec42-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
generator_api = { path = "../crates/generator_api" }
spec42-generator-protocol = { path = "../crates/generator_protocol" }
postcard = { version = "1", features = ["alloc"] }

[[bin]]
name = "artifact_path"
path = "fuzz_targets/artifact_path.rs"
test = false
doc = false
bench = false

[[bin]]
name = "abi_decode"
path = "fuzz_targets/abi_decode.rs"
test = false
doc = false
bench = false

[workspace]
